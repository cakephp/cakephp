name: Publish PHP-FPM images

on:
  push:
    branches:
      - 5.x
    paths:
      - .github/workflows/publish-php-images.yml
      - docker/php-fpm/**
  schedule:
    - cron: '17 3 * * 1' # Mondays at 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: php-images-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/cakephp/cakephp

jobs:
  build:
    name: PHP ${{ matrix.php }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            base: '8.2-fpm-alpine'
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - php: '8.2'
            base: '8.2-fpm-alpine'
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - php: '8.3'
            base: '8.3-fpm-alpine'
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - php: '8.3'
            base: '8.3-fpm-alpine'
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - php: '8.4'
            base: '8.4-fpm-alpine'
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - php: '8.4'
            base: '8.4-fpm-alpine'
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - php: '8.5'
            base: '8.5-fpm-alpine'
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - php: '8.5'
            base: '8.5-fpm-alpine'
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push PHP ${{ matrix.php }} for ${{ matrix.arch }}
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./docker/php-fpm
          file: ./docker/php-fpm/Dockerfile
          platforms: ${{ matrix.platform }}
          pull: true
          build-args: |
            PHP_IMAGE_TAG=${{ matrix.base }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=PHP ${{ matrix.php }} FPM on Alpine with common extensions

      - name: Export image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.php }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish PHP ${{ matrix.php }} multi-arch tag
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - name: Download architecture digests
        uses: actions/download-artifact@v8
        with:
          pattern: digest-${{ matrix.php }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble and verify multi-arch image
        env:
          PHP_VERSION: ${{ matrix.php }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          digests=("$RUNNER_TEMP"/digests/*)
          [[ ${#digests[@]} -eq 2 ]]
          sources=()
          for file in "${digests[@]}"; do
            digest="$(basename "$file")"
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
            sources+=("$IMAGE_NAME@sha256:$digest")
          done
          docker buildx imagetools create -t "$IMAGE_NAME:$PHP_VERSION" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE_NAME:$PHP_VERSION"
