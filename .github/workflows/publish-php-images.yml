name: Publish PHP-FPM images

on:
  push:
    branches:
      - 5.x
    paths:
      - .github/workflows/publish-php-images.yml
      - docker/php-fpm/**
  schedule:
    - cron: '17 3 * * 1' # Mondays at 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/cakephp/cakephp

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            base: '8.1.34-fpm-bookworm'
          - php: '8.2'
            base: '8.2-fpm-bookworm'
          - php: '8.3'
            base: '8.3-fpm-bookworm'
          - php: '8.4'
            base: '8.4-fpm-bookworm'
          - php: '8.5'
            base: '8.5-fpm-bookworm'
    concurrency:
      group: php-image-${{ matrix.php }}
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish PHP ${{ matrix.php }}
        uses: docker/build-push-action@v7
        with:
          context: ./docker/php-fpm
          file: ./docker/php-fpm/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          build-args: |
            PHP_IMAGE_TAG=${{ matrix.base }}
          tags: ${{ env.IMAGE_NAME }}:${{ matrix.php }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=PHP ${{ matrix.php }} FPM on Debian Bookworm slim with common extensions
