---
name: 'api-docs-deploy'

on:
  push:
    tags:
      - 4.*
      - 5.*
  workflow_dispatch:

permissions: {}

jobs:
  trigger-api:
    runs-on: ubuntu-26.04
    steps:
      - name: Rebuild API docs
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DOKKU_SSH_PRIVATE_KEY }}
        run: >
          set -e

          mkdir -p /root/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' >/root/.ssh/id_rsa
          ssh-add /root/.ssh/id_rsa
          ssh dokku@apps.cakephp.org dokku ps:rebuild api-4 --no-cache
          rm /root/.ssh/id_rsa
