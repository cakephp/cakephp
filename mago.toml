#:schema vendor/carthage-software/mago/schema.json
# Welcome to Mago!
# For full documentation, see https://mago.carthage.software/1.47.6/en/tools/overview/

extends = "vendor/cakephp/mago-rules/cakephp.mago.toml"

version = "1"
php-version = "8.5.0"

[source]
workspace = "."
paths = ["config/", "src/", "tests/"]
includes = ["vendor", "tests/bootstrap.php"]
excludes = [
    "vendor/**/tests/**",
    "vendor/**/test/**",
    "vendor/**/Tests/**",
    "**/templates/**",
]

[source.glob]
literal-separator = true

[formatter]
preserve-breaking-argument-list = true
preserve-breaking-parameter-list = true
preserve-breaking-attribute-list = true
preserve-breaking-conditional-expression = true
preserve-breaking-condition-expression = true
preserve-breaking-binary-expression = true
preserve-breaking-pipe-expression = true
preserve-breaking-member-access-chain = true
space-after-cast-unary-prefix-operators = false
expand-use-groups = false
array-table-style-alignment = false

[linter]
excludes = ["tests"]
baseline = "mago-lint-baseline.toml"

[linter.rules]
halstead = { enabled = false }
kan-defect = { enabled = false }
cyclomatic-complexity = { enabled = false }
too-many-properties = { enabled = false }
too-many-methods = { enabled = false }
excessive-parameter-list = { enabled = false }

# These should probably be moved into the common cakephp.mago.toml
no-ini-set = { enabled = false }
function-name = { enabled = false } # This rule expects function names in snake_case while we use camelBacked
assert-description = { enabled = false }
no-negated-ternary = { enabled = true }
no-parameter-shadowing = { enabled = true }
no-literal-password = { enabled = false } # This complains even when you mask a password value like `'password' => '********'` in `__debugInfo()`
prefer-early-continue = { enabled = false } # This rule at times requires adding negated conditions and `continue` statements, which can make code less readable.
